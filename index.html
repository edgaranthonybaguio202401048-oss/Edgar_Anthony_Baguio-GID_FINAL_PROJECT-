<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PineBrew Cafe Iligan – Order App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F0; --card:#FFFFFF; --br:#6F4328; --br2:#8A5A3B; --dk:#3B2416; --pine:#2F7A55; --pineL:#E3F1E8;
  --ink:#24180F; --mute:#7A6A5E; --line:#EADFD3; --cream:#E9D5C1; --chip:#F2E9DF; --red:#C0392B;
  --shadow:0 6px 18px rgba(59,36,22,.08); --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#EDE4DA;display:flex;align-items:center;justify-content:center;gap:48px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.serif{font-family:Lora,Georgia,serif}
/* desktop side caption */
.side{max-width:300px}
.side h1{font-family:Lora,Georgia,serif;font-size:34px;color:var(--dk);line-height:1.15}
.side p{color:var(--mute);margin-top:12px;line-height:1.55;font-size:15px}
.side .tag{display:inline-block;margin-top:18px;background:var(--dk);color:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
@media (max-width:820px){.side{display:none}body{background:var(--bg)}}
/* phone */
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;box-shadow:0 30px 80px rgba(59,36,22,.25),0 0 0 10px #1d130c;position:relative;overflow:hidden}
@media (max-width:820px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:600;font-size:15px}
.status svg{display:block}
.pad{padding:0 24px}
/* splash */
.splash{background:radial-gradient(circle at 50% 0%,#5a3823 0,#3B2416 55%);color:#fff;align-items:center;justify-content:center}
.splash .badge{width:170px;height:170px;border-radius:50%;background:#F7EFE8;display:grid;place-items:center;box-shadow:0 0 0 14px rgba(247,239,232,.08)}
.splash h1{font-family:Lora,Georgia,serif;font-size:44px;margin-top:28px}
.splash .sub{letter-spacing:.25em;font-size:12px;font-weight:600;color:var(--cream);margin-top:6px}
.loadbar{width:200px;height:6px;border-radius:3px;background:#5A3A26;margin-top:120px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:var(--cream);border-radius:3px;animation:load 1.6s ease forwards}
@keyframes load{to{width:100%}}
.splash small{margin-top:14px;color:var(--cream);font-size:13px}
/* header */
.hello{color:var(--mute);font-size:14px;margin-top:8px}
.title{font-family:Lora,Georgia,serif;font-size:26px;font-weight:700;color:var(--dk);margin-top:2px}
.loc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:500;margin-top:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--pine);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.search{margin-top:16px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 24px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--br);border-color:var(--br);color:#fff}
.promo{margin:16px 24px 0;border-radius:20px;background:linear-gradient(120deg,#3B2416,#6F4328);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}
.promo b{font-size:11px;letter-spacing:.14em;color:var(--cream)}
.promo h3{font-family:Lora,Georgia,serif;font-size:19px;margin:4px 0}
.promo p{font-size:12.5px;color:var(--cream)}
.promo code{background:rgba(255,255,255,.15);padding:2px 6px;border-radius:6px;font-weight:700;color:#fff}
.sectionh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 24px 10px}
.sectionh h2{font-family:Lora,Georgia,serif;font-size:19px;color:var(--dk)}
.sectionh span{font-size:13px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 24px 150px}
.item{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.art{width:68px;height:68px;border-radius:14px;flex:none;display:grid;place-items:center}
.item .info{flex:1;min-width:0}
.item h4{font-size:15px;font-weight:600}
.item p{font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .price{font-weight:700;color:var(--br);margin-top:6px;font-size:15px}
.add{width:38px;height:38px;border-radius:19px;background:var(--br);color:#fff;font-size:22px;display:grid;place-items:center;flex:none}
.incart{height:38px;padding:0 12px;border-radius:19px;background:var(--pine);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 0}
/* cart bar + nav */
.cartbar{position:absolute;left:24px;right:24px;bottom:96px;height:58px;border-radius:16px;background:var(--dk);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;box-shadow:0 10px 24px rgba(59,36,22,.35);animation:up .25s ease}
.cartbar .c{flex:1;text-align:left}
.cartbar .c b{display:block;font-size:14px}
.cartbar .c span{font-size:13px;color:var(--cream)}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid var(--line);display:flex;padding-top:10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#9C8E83;position:relative}
.nav button.on{color:var(--br)}
.nav .dot{top:-6px;right:28%}
/* top bar for inner screens */
.topbar{display:flex;align-items:center;gap:12px;padding:6px 24px 10px}
.topbar h2{flex:1;text-align:center;font-family:Lora,Georgia,serif;font-size:21px;color:var(--dk);margin-right:44px}
/* product detail */
.hero{height:300px;display:grid;place-items:center;position:relative}
.hero .back{position:absolute;top:54px;left:24px}
.sheet{flex:1;background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.sheet .scroll{padding:24px 24px 120px}
.sheet h1{font-family:Lora,Georgia,serif;font-size:25px;color:var(--dk)}
.sheet .desc{color:var(--mute);font-size:14px;line-height:1.55;margin-top:8px}
.optlabel{font-size:13px;font-weight:700;margin:20px 0 10px;display:flex;justify-content:space-between}
.optlabel span{font-weight:500;color:var(--mute)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.seg button.on{border-color:var(--br);background:#F7EFE8;color:var(--br)}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;resize:none;height:70px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--br)}
.addbar{position:absolute;left:0;right:0;bottom:0;padding:14px 24px 26px;background:#fff;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:14px;height:54px;padding:0 6px}
.qty button{width:40px;height:40px;border-radius:12px;font-size:20px;font-weight:600}
.qty b{min-width:26px;text-align:center;font-size:16px}
.primary{flex:1;height:56px;border-radius:16px;background:var(--br);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:disabled{background:#BFAE9F;cursor:not-allowed}
.secondary{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--br);color:var(--br);font-weight:700;font-size:16px;background:#fff}
/* cart */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .art{width:56px;height:56px;border-radius:12px}
.line h4{font-size:14px;font-weight:600}
.line p{font-size:12px;color:var(--mute);margin-top:2px}
.line .lp{font-weight:700;color:var(--br);font-size:14px;margin-top:4px}
.mini{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:10px}
.mini button{width:30px;height:30px;font-size:16px;font-weight:700}
.mini b{min-width:18px;text-align:center;font-size:14px}
.sumrow{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin:6px 0}
.sumrow b{color:var(--ink);font-weight:600}
.sumrow.total{color:var(--ink);font-weight:700;font-size:17px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sumrow.total b{color:var(--br);font-size:21px}
.promoin{display:flex;gap:8px;margin-top:12px}
.promoin input{flex:1;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;outline:none;text-transform:uppercase}
.promoin button{height:44px;padding:0 16px;border-radius:12px;background:var(--dk);color:#fff;font-weight:700;font-size:13px}
.note{font-size:12px;margin-top:6px}
.ok{color:var(--pine)} .err{color:var(--red)}
.bottombar{position:absolute;left:0;right:0;bottom:0;padding:14px 24px 28px;background:#fff;box-shadow:0 -6px 18px rgba(0,0,0,.05)}
/* checkout */
.h3{font-family:Lora,Georgia,serif;font-size:17px;color:var(--dk);margin:22px 0 10px}
.toggle{display:flex;background:#EFE6DC;border-radius:14px;padding:4px}
.toggle button{flex:1;height:44px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mute)}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.field input,.field select{height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none;font-size:14px}
.field.bad input,.field.bad select{border-color:var(--red)}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.slots button.on{border-color:var(--br);background:#F7EFE8;color:var(--br)}
.pay{display:flex;flex-direction:column;gap:10px}
.payopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;width:100%}
.payopt.on{border-color:var(--br);background:#F7EFE8}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #B8ABA0;display:grid;place-items:center;flex:none}
.payopt.on .radio{border-color:var(--br)}
.payopt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--br)}
.payopt b{display:block;font-size:14px}
.payopt span{font-size:12px;color:var(--mute)}
.logo{margin-left:auto;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}
.demo{background:#FFF7E6;border:1px solid #F2D9A6;color:#7A5A12;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;margin-top:14px}
/* processing / gcash */
.proc{background:radial-gradient(circle at 50% 0%,#5a3823 0,#3B2416 60%);color:#fff;align-items:center;justify-content:center;text-align:center}
.spin{width:90px;height:90px;border-radius:50%;border:8px solid #5A3A26;border-top-color:var(--cream);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc h2{font-family:Lora,Georgia,serif;font-size:24px;margin-top:28px}
.proc p{color:var(--cream);margin-top:8px;font-size:14px}
/* success */
.check{width:110px;height:110px;border-radius:50%;background:var(--pine);display:grid;place-items:center;margin:30px auto 0;box-shadow:0 0 0 18px var(--pineL);animation:pop .4s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.center{text-align:center}
.big{font-family:Lora,Georgia,serif;font-size:28px;color:var(--dk);margin-top:30px}
.tracker{display:flex;justify-content:space-between;position:relative;margin:8px 6px 4px}
.tracker::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:4px;background:var(--line);border-radius:2px}
.tracker .fill{position:absolute;left:14px;top:13px;height:4px;background:var(--pine);border-radius:2px;transition:width .6s}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:80px;font-size:12px;color:var(--mute);font-weight:600}
.step i{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;color:#fff;font-size:14px;transition:.4s}
.step.done{color:var(--ink)} .step.done i{background:var(--pine);border-color:var(--pine)}
/* orders */
.ord{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--pineL);color:var(--pine)}
/* contact */
.cinfo{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cinfo:last-child{border-bottom:0}
.cinfo .ic{width:40px;height:40px;border-radius:12px;background:#F7EFE8;display:grid;place-items:center;flex:none}
.cinfo small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.cinfo b{font-size:14.5px}
.toast{position:absolute;left:24px;right:24px;bottom:110px;background:var(--dk);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:up .2s ease;z-index:50}
.fade{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateX(12px)}}
</style>
</head>
<body>
<div class="side">
  <h1>PineBrew Cafe<br>Iligan City</h1>
  <p>Working mobile ordering prototype: browse the menu, customize drinks, build a cart, choose pickup or delivery, pay and track your order.</p>
  <p>UX Design project by <b>Edgar Anthony Baguio</b>, Block B.</p>
  <span class="tag">Prototype – no real payments</span>
</div>
<div class="phone" id="phone"><div id="app"></div></div>

<script>

};
const PHOTOS = {
  p_latte:'photos/latte.jpg',
  p_icedlatte:'photos/icedlatte.jpg',
  p_americano:'photos/americano.jpg',
  p_cappuccino:'photos/cappuccino.jpg',
  p_macchiato:'photos/macchiato.jpg',
  p_mocha:'photos/mocha.jpg',

  go('product');

  const p = MENU.find(m=>m.id===id);

  if(p.beans) o.grind='Whole bean';
  addToCart(p,o,1); toast('Added '+p.name);

function addToCart(p,o,qty){
  const clean = {...o}; delete clean.qty;
  const key = p.id+'|'+JSON.stringify(clean);
  const ex = S.cart.find(l=>l.key===key);
  if(ex) ex.qty += qty; else S.cart.push({key,pid:p.id,name:p.name,art:p.art,opt:clean,unit:unitPrice(p,clean),qty});
  save();
}

  render();
}
function validate(){
  const e={};
  if(!S.name.trim()) e.name=1;
  if(!/^(09|\+639)\d{2}\s?\d{3}\s?\d{4}$/.test(S.phone.replace(/-/g,'').trim())) e.phone=1;
  if(S.mode==='delivery' && S.address.trim().length<4) e.address=1;
  if(S.pay==='card'){ if(S.card.num.replace(/\s/g,'').length<15) e.num=1; if(!/^\d{2}\/\d{2}$/.test(S.card.exp)) e.exp=1; if(!/^\d{3,4}$/.test(S.card.cvv)) e.cvv=1; }
  S.errors=e; return !Object.keys(e).length;
}
function placeOrder(){
  if(!validate()){ render(); toast('Please check the highlighted fields'); return; }
  const n = 1040 + S.orders.length + Math.floor(Math.random()*9)+1;
  S.current = {no:'PB-'+n, items:S.cart.map(l=>({...l})), sub:subtotal(), disc:discount(), fee:fee(), total:total(), mode:S.mode, slot:S.slot, area:S.area, address:S.address, pay:S.pay, promo:S.promo, stage:0, time:new Date()};
  go('processing');
  setTimeout(()=>{
    S.orders.unshift(S.current); S.cart=[]; S.promo=null; S.promoMsg=''; save(); go('success');
    const ord=S.current; [1,2].forEach((st,k)=>setTimeout(()=>{ord.stage=st; if(S.screen==='success'||S.screen==='orders') render();},(k+1)*5000));
  }, 2200);
}

function summary(showFee){
  return `<div class="sumrow">Subtotal<b>${peso(subtotal())}</b></div>
   ${S.promo?`<div class="sumrow">Promo (${S.promo})<b class="ok">−${peso(discount())}</b></div>`:''}
   ${showFee?`<div class="sumrow">${S.mode==='delivery'?'Delivery fee ('+S.area+')':'Pickup'}<b>${S.mode==='delivery'?peso(fee()):'Free'}</b></div>`:''}
   <div class="sumrow total">${showFee?'Total':'Estimated total'}<b>${peso(showFee?total():subtotal()-discount())}</b></div>`;
}
function vCart(){
  const c=count();
  return `<div class="screen fade">${STATUS}<div class="topbar"><button class="iconbtn" onclick="go('menu')">${I.back}</button><h2>My Cart</h2></div>
  <div class="scroll pad" style="padding-bottom:${c?190:110}px">
   ${c?`<div class="card">${S.cart.map((l,i)=>`<div class="line">${art(l.art,56,12)}<div style="flex:1;min-width:0"><h4>${l.name}</h4><p>${optText(l.opt)||'Standard'}</p><div class="lp">${peso(l.unit*l.qty)}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><button onclick="S.cart.splice(${i},1);save();render()" aria-label="Remove">${I.trash}</button>
      <div class="mini"><button onclick="changeQty(${i},-1)">−</button><b>${l.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div></div>`).join('')}</div>
   <button class="secondary" style="margin-top:14px;height:48px;font-size:14px" onclick="go('menu')">+ Add more items</button>
   <div class="h3">Promo code</div>
   <div class="promoin"><input id="promo" placeholder="e.g. ILIGAN10" value="${S.promo||''}"><button onclick="applyPromo()">Apply</button></div>
   ${S.promoMsg?`<div class="note ${S.promo?'ok':'err'}">${S.promoMsg}</div>`:''}
   <div class="card" style="margin-top:18px">${summary(false)}</div>`
   :`<div class="empty" style="padding-top:120px"><div style="display:flex;justify-content:center;margin-bottom:18px">${art('p_latte',110,26)}</div><div style="font-family:Lora,Georgia,serif;font-size:21px;color:var(--dk)">Your cart is empty</div><p style="margin:8px 0 22px">Treat yourself to a coffee break, Iligan.</p><button class="primary" style="width:100%" onclick="go('menu')">Browse the menu</button></div>`}
  </div>
  ${c?`<div class="bottombar" style="bottom:84px;box-shadow:none;border-top:1px solid var(--line);padding-bottom:14px"><button class="primary" style="width:100%" onclick="go('checkout')">Checkout · ${peso(subtotal()-discount())}</button></div>`:''}
  ${navBar('cart')}</div>`;
}
const fld=(id,label,val,ph,on,type='text')=>`<div class="field ${S.errors[id]?'bad':''}"><label>${label}</label><input type="${type}" value="${String(val).replace(/"/g,'&quot;')}" placeholder="${ph}" oninput="${on}"></div>`;
function vCheckout(){
  const d=S.mode==='delivery';
  return `<div class="screen fade">${STATUS}<div class="topbar"><button class="iconbtn" onclick="go('cart')">${I.back}</button><h2>Checkout</h2></div>
  <div class="scroll pad" style="padding-bottom:130px">
   <div class="card"><div style="display:flex;justify-content:space-between;font-weight:700"><span class="serif" style="font-size:16px;color:var(--dk)">Order Summary</span><span style="color:var(--mute);font-weight:500;font-size:13px">${count()} items</span></div>
    ${S.cart.map(l=>`<div class="line" style="padding:10px 0">${art(l.art,44,10)}<div style="flex:1;min-width:0"><h4 style="font-size:13.5px">${l.qty}× ${l.name}</h4><p>${optText(l.opt)||'Standard'}</p></div><b style="font-size:14px">${peso(l.unit*l.qty)}</b></div>`).join('')}</div>
   <div class="h3">Pickup or Delivery</div>
   <div class="toggle"><button class="${!d?'on':''}" onclick="S.mode='pickup';render()">Pickup · Free</button><button class="${d?'on':''}" onclick="S.mode='delivery';render()">Delivery</button></div>
   ${!d?`<div class="card" style="margin-top:12px;display:flex;gap:12px;align-items:center;box-shadow:none;border:1px solid var(--line)">${I.pin()}<div><b style="font-size:14px">PineBrew Cafe, Sabayle Street</b><div style="font-size:12px;color:var(--mute)">Pick up at the counter</div></div></div>
     <div class="optlabel" style="margin-top:16px">Pickup time</div><div class="slots">${SLOTS.map(s=>`<button class="${S.slot===s?'on':''}" onclick="S.slot='${s}';render()">${s}</button>`).join('')}</div>`
   :`<div class="field"><label>BARANGAY IN ILIGAN</label><select onchange="S.area=this.value;render()">${AREAS.map(a=>`<option ${S.area===a[0]?'selected':''} value="${a[0]}">${a[0]} — ${peso(a[1])} fee</option>`).join('')}</select></div>
     ${fld('address','HOUSE / BUILDING, STREET',S.address,'e.g. Blk 2 Lot 5, Purok 3',"S.address=this.value")}
     <div class="note" style="color:var(--mute)">Arrives in about 30–45 minutes.</div>`}
   <div class="h3">Your details</div>
   ${fld('name','FULL NAME',S.name,'Your name',"S.name=this.value")}
   ${fld('phone','MOBILE NUMBER',S.phone,'09XX XXX XXXX',"S.phone=this.value",'tel')}
   <div class="h3">Payment Method</div>
   <div class="pay">
    ${[['gcash','GCash','Pay instantly with your GCash wallet','<span class="logo" style="background:#0A6CFF;color:#fff">GCash</span>'],['card','Credit / Debit Card','Visa, Mastercard','<span class="logo" style="background:#1F2937;color:#fff">VISA</span>'],['cash',d?'Cash on Delivery':'Cash on Pickup',d?'Pay the rider':'Pay at the counter','<span class="logo" style="background:var(--pineL);color:var(--pine)">₱</span>']].map(([k,t,s,l])=>`<button class="payopt ${S.pay===k?'on':''}" onclick="S.pay='${k}';render()"><span class="radio"></span><div><b>${t}</b><span>${s}</span></div>${l}</button>`).join('')}
   </div>
   ${S.pay==='card'?`${fld('num','CARD NUMBER',S.card.num,'4242 4242 4242 4242',"S.card.num=this.value")}<div class="row2">${fld('exp','EXPIRY',S.card.exp,'MM/YY',"S.card.exp=this.value")}${fld('cvv','CVV',S.card.cvv,'123',"S.card.cvv=this.value")}</div>`:''}
   ${S.pay==='gcash'?`<div class="note" style="color:var(--mute);margin-top:10px">You'll confirm the payment on the next screen.</div>`:''}
   <div class="card" style="margin-top:18px">${summary(true)}</div>
   <div class="demo">This is a class prototype: no real payment is charged and no order is sent to a cafe.</div>
   <p style="text-align:center;font-size:13px;color:var(--mute);margin-top:18px">Need help? <button style="color:var(--br);font-weight:700;text-decoration:underline" onclick="go('contact')">Contact Us</button></p>
  </div>
  <div class="bottombar"><button class="primary" style="width:100%" onclick="placeOrder()">${S.pay==='cash'?'Place Order':'Pay'} · ${peso(total())}</button></div></div>`;
}
function vProcessing(){
  const o=S.current; const g=o.pay==='gcash';
  return `<div class="screen proc">${STATUS.replace('class="status"','class="status" style="position:absolute;top:0;left:0;right:0;color:#fff"')}
   <div class="spin"></div><h2>${o.pay==='cash'?'Sending your order...':g?'Confirming GCash payment...':'Processing card payment...'}</h2>
   <p>${peso(o.total)} · Order ${o.no}</p><p style="position:absolute;bottom:60px;left:0;right:0;font-size:13px;color:#B89A82">Please don't close the app</p></div>`;
}
function tracker(o){
  const steps=o.mode==='delivery'?['Received','Brewing','On the way']:['Received','Brewing','Ready'];
  return `<div class="tracker"><div class="fill" style="width:calc(${o.stage*50}% - ${o.stage*14}px)"></div>${steps.map((s,k)=>`<div class="step ${k<=o.stage?'done':''}"><i>${k<=o.stage?'✓':''}</i>${s}</div>`).join('')}</div>`;
}
function statusText(o){
  const d=o.mode==='delivery';
  return [d?'We got your order!':'We got your order!','Your order is being prepared ☕',d?'Your rider is on the way to '+o.area:'Ready for pickup at the counter!'][o.stage]+(o.stage<2?(d?' · Arrives in 30–45 min':' · Pickup '+o.slot):'');
}
function vSuccess(){
  const o=S.current;
  return `<div class="screen fade">${STATUS}<div class="scroll pad" style="padding-bottom:40px">
   <div class="check"><svg width="48" height="36" viewBox="0 0 44 34"><path d="M4 17L16 29L40 4" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
   <div class="center"><div class="big">Order received!</div><p style="color:var(--mute);margin-top:6px;font-size:14px">Order #${o.no} · ${o.pay==='cash'?'Pay '+peso(o.total)+(o.mode==='delivery'?' to the rider':' at pickup'):'Payment successful'}</p></div>
   <div class="card" style="margin-top:22px">${tracker(o)}<p style="text-align:center;font-weight:600;color:var(--br);font-size:13.5px;margin-top:14px">${statusText(o)}</p></div>
   <div class="card" style="margin-top:14px"><div class="serif" style="font-weight:700;font-size:16px;color:var(--dk);margin-bottom:6px">Receipt</div>
    ${o.items.map(l=>`<div class="sumrow">${l.qty}× ${l.name}<b>${peso(l.unit*l.qty)}</b></div>`).join('')}
    ${o.disc?`<div class="sumrow">Promo (${o.promo})<b class="ok">−${peso(o.disc)}</b></div>`:''}
    <div class="sumrow">${o.mode==='delivery'?'Delivery fee':'Pickup'}<b>${o.fee?peso(o.fee):'Free'}</b></div>
    <div class="sumrow total">${o.pay==='cash'?'Total to pay':'Total paid'}<b>${peso(o.total)}</b></div>
    <div class="sumrow" style="margin-top:8px">Payment<b>${{gcash:'GCash',card:'Card',cash:o.mode==='delivery'?'Cash on Delivery':'Cash on Pickup'}[o.pay]}</b></div>
    <div class="sumrow">${o.mode==='delivery'?'Deliver to':'Pickup'}<b style="text-align:right;max-width:60%">${o.mode==='delivery'?(o.address||'')+', '+o.area:'Sabayle St. · '+o.slot}</b></div></div>
   <button class="primary" style="width:100%;margin-top:18px" onclick="go('menu')">Order Again</button>
   <button class="secondary" style="margin-top:10px" onclick="go('contact')">Contact Us</button>
  </div></div>`;
}
function vOrders(){
  return `<div class="screen fade">${STATUS}<div class="topbar"><span style="width:44px"></span><h2 style="margin-right:44px">My Orders</h2></div>
  <div class="scroll pad" style="padding-bottom:110px">
   ${S.orders.length?S.orders.map((o,i)=>`<div class="card" style="margin-bottom:12px"><div class="ord"><div><b>Order #${o.no}</b><div style="font-size:12px;color:var(--mute);margin-top:2px">${o.items.reduce((a,l)=>a+l.qty,0)} items · ${peso(o.total)} · ${o.mode==='delivery'?'Delivery':'Pickup'}</div></div><span class="pill">${['Received','Brewing',o.mode==='delivery'?'On the way':'Ready'][o.stage]}</span></div>
     <div style="margin-top:14px">${tracker(o)}</div><button class="secondary" style="margin-top:14px;height:44px;font-size:14px" onclick="S.current=S.orders[${i}];go('success')">View details</button></div>`).join('')
   :`<div class="empty" style="padding-top:140px"><div style="font-family:Lora,Georgia,serif;font-size:21px;color:var(--dk)">No orders yet</div><p style="margin:8px 0 22px">Your orders and their status will show here.</p><button class="primary" style="width:100%" onclick="go('menu')">Start an order</button></div>`}
  </div>${navBar('orders')}</div>`;
}
function vContact(){
  return `<div class="screen fade">${STATUS}<div class="topbar"><button class="iconbtn" onclick="go(S.prev&&S.prev!=='contact'?S.prev:'menu')">${I.back}</button><h2>Contact Us</h2></div>
  <div class="scroll pad" style="padding-bottom:110px">
   <svg width="100%" height="170" viewBox="0 0 342 170" preserveAspectRatio="xMidYMid slice" style="border-radius:18px;display:block"><rect width="342" height="170" fill="#E4EDDF"/><path d="M0 110C80 100 120 50 342 60" stroke="#fff" stroke-width="14" fill="none"/><path d="M110 0L150 170" stroke="#fff" stroke-width="10"/><path d="M230 0C220 60 260 110 250 170" stroke="#fff" stroke-width="8" fill="none"/><circle cx="60" cy="35" r="24" fill="#C9DEC1"/><circle cx="300" cy="140" r="28" fill="#C9DEC1"/><text x="196" y="52" font-size="10" font-family="Inter,sans-serif" fill="#7A6A5E">Sabayle St</text><path d="M171 86C171 86 190 68 190 55C190 44 181 37 171 37C161 37 152 44 152 55C152 68 171 86 171 86Z" fill="#6F4328"/><circle cx="171" cy="55" r="7" fill="#fff"/></svg>
   <div class="serif" style="font-size:21px;font-weight:700;color:var(--dk);margin-top:16px">PineBrew Cafe – Sabayle Street</div>
   <div style="color:var(--mute);font-size:14px;margin-top:4px">Sabayle Street, Poblacion, Iligan City, Lanao del Norte</div>
   <div class="card" style="margin-top:14px;padding:4px 16px">
    <div class="cinfo"><div class="ic">${I.clock}</div><div><small>HOURS</small><b>Open daily, 7:00 AM – 10:00 PM</b></div></div>
    <div class="cinfo"><div class="ic">${I.phone}</div><div><small>PHONE</small><b>(063) 123-4567</b></div></div>
    <div class="cinfo"><div class="ic">${I.chat}</div><div><small>MESSENGER</small><b>@PineBrewIligan</b></div></div>
    <div class="cinfo"><div class="ic">${I.mail}</div><div><small>EMAIL</small><b>hello@pinebrew.ph</b></div></div>
   </div>
   <div class="h3">Send us a message</div>
   <textarea id="msg" placeholder="Questions about your order, catering or events?"></textarea>
   <button class="primary" style="width:100%;margin-top:12px" onclick="if(!document.getElementById('msg').value.trim()){toast('Please type a message first');return;}document.getElementById('msg').value='';toast('Message saved (prototype only, not actually sent)')">Send Message</button>
  </div>${navBar('contact')}</div>`;
}
const VIEWS={splash:vSplash,menu:vMenu,product:vProduct,cart:vCart,checkout:vCheckout,processing:vProcessing,success:vSuccess,orders:vOrders,contact:vContact};
function render(){
  const app=document.getElementById('app'); const sc=app.querySelector('.scroll'); const top=sc?sc.scrollTop:0; const same=app.dataset.s===S.screen;
  app.innerHTML=VIEWS[S.screen]()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  app.dataset.s=S.screen;
  if(same){const n=app.querySelector('.scroll'); if(n) n.scrollTop=top;}
}
function renderKeep(id){ const el=document.getElementById(id); const pos=el?el.selectionStart:0; render(); const n=document.getElementById(id); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}} }
render();
if(!window.__NOAUTO) setTimeout(()=>{ if(S.screen==='splash') go('menu'); },1800);
</script>
</body>
</html>
